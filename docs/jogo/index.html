<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#D62828">
  <title>history.quest</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icone-192.png">
  <link rel="apple-touch-icon" href="icone-192.png">
  <link rel="stylesheet" href="placar.css">
  <link rel="stylesheet" href="estilo.css">
  <script src="config.js"></script>
  <script src="placar.js"></script>
  <script src="placar-ui.js"></script>
  <script src="regras.js"></script>
  <script src="pwa.js" defer></script>
  <script src="jogo.js" defer></script>
</head>
<body>
  <main class="jogo">
    <header class="topo">
      <div><p class="sobretitulo">DESAFIO DE HISTÓRIA</p><h1 id="titulo">history.quest</h1></div>
      <p class="recorde">Recorde <strong id="melhor">0</strong></p>
    </header>

    <section id="tela-inicio" class="tela" aria-labelledby="titulo">
      <div class="selo" aria-hidden="true">📜</div>
      <h2>Uma viagem pelo tempo</h2>
      <p class="instrucao">Responda a 10 perguntas. Você tem 15 segundos para cada uma. Cada acerto vale 100 pontos, mais os segundos que sobrarem.</p>
      <button id="botao-jogar" class="botao" type="button">Começar desafio</button>
    </section>

    <section id="tela-jogo" class="tela" hidden aria-label="Partida">
      <div class="linha-status"><span id="progresso-pergunta">Pergunta 1 de 10</span><span class="cronometro"><span aria-hidden="true">⏱</span> <span id="tempo">15</span>s</span></div>
      <div class="barra-tempo" aria-hidden="true"><span id="barra"></span></div>
      <h2 id="pergunta" class="pergunta"></h2>
      <div id="alternativas" class="alternativas" role="group" aria-label="Alternativas"></div>
      <p id="feedback" class="feedback" role="status" aria-live="polite" hidden></p>
      <button id="botao-proxima" class="botao" type="button" hidden>Próxima pergunta</button>
      <p class="pontos-ao-vivo">Pontos: <strong id="pontos">0</strong></p>
    </section>

    <section id="tela-fim" class="tela" hidden aria-label="Fim da partida">
      <div class="selo" aria-hidden="true">🏛️</div>
      <h2>Desafio concluído!</h2>
      <p class="instrucao">Sua pontuação: <strong id="resultado">0</strong></p>
      <p id="situacao-salvamento" role="status" aria-live="polite"></p>
      <button id="botao-de-novo" class="botao" type="button">Jogar de novo</button>
    </section>

    <aside id="painel-placar" aria-label="Placar"></aside>
  </main>
</body>
</html>
